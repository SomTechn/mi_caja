<style>
/* Layout: herramienta de libro mayor — barra de banco/fechas arriba, resumen en 4 cifras, luego dos columnas de pendientes (sistema | banco) que se apilan en el teléfono. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ede8; --ink:#17201c; --muted:#5a6862; --line:#d7ded8;
  --accent:#0e6650; --accent-soft:#dcefe7; --on-accent:#ffffff;
  --ok:#1d7446; --ok-soft:#dff1e5; --warn:#94600a; --warn-soft:#fbefd6; --bad:#b0281f; --bad-soft:#fbe3e0;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201c; --sunk:#0d120f; --ink:#e4ebe7; --muted:#97a69f; --line:#2b3530;
  --accent:#43c39b; --accent-soft:#183a2f; --on-accent:#08140f;
  --ok:#55c98c; --ok-soft:#173326; --warn:#e5ab48; --warn-soft:#3a2c12; --bad:#f2786d; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201c; --sunk:#0d120f; --ink:#e4ebe7; --muted:#97a69f; --line:#2b3530;
  --accent:#43c39b; --accent-soft:#183a2f; --on-accent:#08140f;
  --ok:#55c98c; --ok-soft:#173326; --warn:#e5ab48; --warn-soft:#3a2c12; --bad:#f2786d; --bad-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.banner{border-radius:var(--r);padding:10px 14px;margin-block:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ex{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
input[type=date],input[type=text],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
textarea{width:100%;min-height:150px;font-family:var(--f-num);font-size:12.5px;line-height:1.5;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.muted{color:var(--muted)}
.small{font-size:13px}
/* chips de banco */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .badge{font-family:var(--f-num);font-size:12px;border-radius:999px;padding:1px 8px;background:var(--ok-soft);color:var(--ok)}
.chip .badge.bad{background:var(--bad-soft);color:var(--bad)}
.chip .badge.none{background:var(--sunk);color:var(--muted)}
/* resumen */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:18px}}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.seg button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg .n{font-family:var(--f-num);font-size:12px;margin-left:4px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-block:4px 8px}
.colh h3{font-size:15px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.sel{background:var(--accent-soft)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.in{color:var(--ok)} .out{color:var(--bad)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12px}
.selbar{position:sticky;bottom:0;margin-top:12px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.selbar .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.selbar .btn.pri{background:var(--accent);color:var(--on-accent)}
.selbar input{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 10px;flex:1;min-width:140px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.step b{display:block;margin-bottom:4px}
.step .k{font-family:var(--f-num);color:var(--accent);font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.bank-cfg{display:grid;grid-template-columns:1.2fr 1.6fr .6fr .6fr auto;gap:10px;align-items:end;padding-block:12px;border-top:1px solid var(--line)}
.bank-cfg:first-of-type{border-top:0}
@media (max-width:860px){.bank-cfg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.toggles{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.toggles label{display:flex;gap:6px;align-items:center}
.avisos{margin:0;padding-left:18px;color:var(--warn);font-size:13.5px}
.okmsg{color:var(--ok);font-weight:600}
.acceso{max-width:440px;margin:24px auto 0}
.acceso input{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-size:13.5px}
details summary{cursor:pointer;font-weight:600}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.sec h4{margin:0 0 6px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.date-chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);cursor:pointer;font-size:13px}
.date-chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Concilia</h1><span>Más Pisto · conciliación bancaria</span></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="conciliar" aria-selected="true">Conciliar</button>
      <button role="tab" data-tab="bancos" aria-selected="false">Estados de cuenta</button>
      <button role="tab" data-tab="sistema" aria-selected="false">Reporte del sistema</button>
      <button role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
    </nav>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== Motor de conciliación (sin dependencias de la interfaz) ===== */
const E = (() => {
  const DAY = 864e5;
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const MOJI = [['Ã¿', 'Ñ'], ['Ã‘', 'Ñ'], ['Ã\u0091', 'Ñ'], ['Ã±', 'ñ'], ['Ã¡', 'á'], ['Ã©', 'é'], ['Ã­', 'í'], ['Ã³', 'ó'], ['Ãº', 'ú'], ['Ã‰', 'É'], ['Ã“', 'Ó'], ['Ãš', 'Ú'], ['Ã\u0081', 'Á'], ['Ã\u008d', 'Í'], ['Ã¼', 'ü']];
  const fixText = s => { s = String(s ?? ''); if (s.includes('Ã')) for (const [a, b] of MOJI) s = s.split(a).join(b); return s.replace(/\s+/g, ' ').trim(); };

  const MESES = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12, ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, sept: 9, set: 9, oct: 10, nov: 11, dic: 12 };
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => {
    if (y < 100) y += 2000;
    if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 1990 && y < 2100)) return null;
    return `${y}-${pad(m)}-${pad(d)}`;
  };
  function parseFecha(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number') { // serial de Excel
      if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * DAY)); return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
      return null;
    }
    const s = norm(v);
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if (m) return iso(+m[3], +m[2], +m[1]);
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/);
    if (m) return iso(+m[1], +m[2], +m[3]);
    m = s.match(/(\d{1,2})(?: de)?[ \-\/]([a-z]{3,10})\.?(?: de(?:l)?)?[ \-\/](\d{2,4})/);
    if (m && MESES[m[2]]) return iso(+m[3], MESES[m[2]], +m[1]);
    return null;
  }
  function parseMonto(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).replace(/lps\.?|lempiras|hnl|\bl\.?(?=\s*[\d\-(])/gi, '').replace(/\s/g, '');
    if (s === '-' || s === '') return 0;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
    if (!/^[\d,]*\.?\d+$/.test(s) && !/^[\d,]+$/.test(s)) return null;
    const n = parseFloat(s.replace(/,/g, ''));
    return isFinite(n) ? (neg ? -n : n) : null;
  }
  const cents = n => Math.round((n || 0) * 100);
  const dn = f => Math.round(Date.UTC(+f.slice(0, 4), +f.slice(5, 7) - 1, +f.slice(8, 10)) / DAY);
  const fromDn = d => new Date(d * DAY).toISOString().slice(0, 10);
  const dow = d => ((d % 7) + 11) % 7; // 0 = domingo
  const addDays = (f, k) => fromDn(dn(f) + k);

  /* ---------- Reporte del sistema (pegado) ---------- */
  function seccionDe(cells, bancos) {
    const first = norm(cells[0]);
    if (!first || first.length > 30) return null;
    const rest = cells.slice(1).join(' ');
    if (!/lps/i.test(rest) && cells.filter(c => c !== '').length > 2) return null;
    if (first === 'caja') return { id: 'caja', nombre: 'Caja' };
    for (const b of bancos) {
      const names = [b.nombre, ...(b.alias || [])].map(norm).filter(Boolean);
      if (names.includes(first)) return { id: b.id, nombre: b.nombre };
    }
    if (/lps/i.test(rest) && cells.filter(c => c !== '').length <= 3 && !/^(total|cierre)/.test(first)) return { id: '?' + first, nombre: cells[0], desconocido: true };
    return null;
  }
  function parseSistema(texto, bancos) {
    const lines = String(texto || '').replace(/\r/g, '').split('\n');
    const secciones = {}; const avisos = []; let cur = null; let saldo = 0;
    for (let raw of lines) {
      if (!raw.trim()) continue;
      let cells = raw.includes('\t') ? raw.split('\t') : raw.split(/\s{2,}/);
      cells = cells.map(c => c.trim());
      const sec = seccionDe(cells, bancos);
      if (sec) {
        cur = secciones[sec.id] = { id: sec.id, nombre: sec.nombre, desconocido: !!sec.desconocido, items: [], total: null, cierre: null, inicial: parseMonto(cells[cells.length - 1]) || 0 };
        saldo = cur.inicial;
        if (sec.desconocido) avisos.push(`La sección "${sec.nombre}" no coincide con ningún banco de Ajustes. Agregue ese nombre al banco que corresponda.`);
        continue;
      }
      const h = norm(cells[0]);
      if (!cur) continue;
      if (h.startsWith('total del dia')) {
        const nums = cells.slice(1).map(parseMonto).filter(n => n != null);
        cur.total = { ing: nums[0] ?? 0, egr: nums[1] ?? 0, neto: nums[2] ?? null };
        continue;
      }
      if (h.startsWith('cierre diario')) { cur.cierre = parseMonto(cells[cells.length - 1]); continue; }
      // movimiento: doc | desc | ingreso | egreso | saldo
      let saldoCell = null, saldoIdx = -1;
      for (let i = cells.length - 1; i >= 1; i--) if (/lps/i.test(cells[i])) { saldoCell = parseMonto(cells[i]); saldoIdx = i; break; }
      let ing = null, egr = null;
      if (raw.includes('\t') && cells.length >= 4) {
        const end = saldoIdx > 0 ? saldoIdx : cells.length;
        ing = parseMonto(cells[end - 2]); egr = parseMonto(cells[end - 1]);
        if (cells[end - 2] === '' || cells[end - 2] == null) ing = null;
        if (cells[end - 1] === '' || cells[end - 1] == null) egr = null;
      } else {
        const nums = cells.slice(1, saldoIdx > 0 ? saldoIdx : undefined).map(parseMonto).filter(n => n != null);
        if (nums.length) ing = nums[nums.length - 1];
      }
      let monto = ing || egr; if (!monto) continue;
      let dir = ing ? 'in' : 'out';
      if (saldoCell != null) {
        if (Math.abs(saldo + monto - saldoCell) < 0.011) dir = 'in';
        else if (Math.abs(saldo - monto - saldoCell) < 0.011) dir = 'out';
        else avisos.push(`${cur.nombre}: el saldo no cuadra en "${cells[0]} ${cells[1] || ''} ${monto}".`);
        saldo = saldoCell;
      } else saldo += dir === 'in' ? monto : -monto;
      const desc = fixText(cells.slice(1, Math.max(2, (saldoIdx > 0 ? saldoIdx : cells.length) - 2)).join(' ')) || fixText(cells[1]);
      cur.items.push({ doc: cells[0], desc, monto, dir, saldo });
    }
    for (const s of Object.values(secciones)) {
      const ing = s.items.filter(i => i.dir === 'in').reduce((a, i) => a + i.monto, 0);
      const egr = s.items.filter(i => i.dir === 'out').reduce((a, i) => a + i.monto, 0);
      s.ing = ing; s.egr = egr;
      const ult = s.items.length ? s.items[s.items.length - 1].saldo : s.inicial;
      s.completo = s.cierre == null || Math.abs(ult - s.cierre) < 0.011;
      if (!s.completo) avisos.push(`${s.nombre}: el último saldo leído (${ult.toFixed(2)}) no coincide con el cierre diario (${s.cierre.toFixed(2)}). Puede que falten movimientos en lo pegado.`);
      else if (s.total && (Math.abs(s.total.ing - ing) > 0.01 || Math.abs(s.total.egr - egr) > 0.01))
        avisos.push(`${s.nombre}: los movimientos suman ingresos ${ing.toFixed(2)} y egresos ${egr.toFixed(2)}, y cuadran con el cierre diario, pero el "Total del día" del sistema dice ${s.total.ing.toFixed(2)} / ${s.total.egr.toFixed(2)}. El total que muestra el sistema está mal calculado.`);
    }
    return { secciones, avisos };
  }

  /* ---------- Estados de cuenta ---------- */
  const KW = {
    fecha: [/^fecha$/, /^fecha (de )?(transaccion|operacion|movimiento|contable|registro)/, /^fecha/],
    ref: [/^referencia/, /^ref\b/, /^no\.? ?(de )?(documento|referencia|transaccion)/, /^documento/, /^n(°|o|º)\.? ?cheque/, /^cheque/],
    cod: [/^codigo/, /^cod\b/, /^trx$/, /^tipo trx/, /^tipo$/, /^tipo (de )?(transaccion|movimiento)/],
    desc: [/^descripcion/, /^concepto/, /^detalle/, /^transaccion/, /^movimiento$/, /^glosa/],

/* Cargos bancarios (comisiones, tasas) que están en el banco y no en el sistema,

function esCargo(x) {
  if (x.dir !== 'out') return false;
  const d = E.norm(x.desc);
  return (ST.cfg.cargos || CARGOS_BASE).some(k => k && d.includes(E.norm(k)));

    const o = g.get(k); o.items.push(x); o.total += x.c;
  }
  const orden = ST.cfg.bancos.map(b => b.id);
  return [...g.values()].map(o => ({ ...o, total: o.total / 100, desc: o.items.map(x => `${x.desc} ${m2(x.monto)}`).join(' ') }))

async function leerArchivoBanco(file) {
  const buf = await file.arrayBuffer();
  let wb;
  if (/\.(csv|txt)$/i.test(file.name)) wb = XLSX.read(new TextDecoder('utf-8').decode(buf), { type: 'string', cellDates: true, raw: false });
  else wb = XLSX.read(buf, { type: 'array', cellDates: true });
  // elegir la hoja con más filas con fecha
  let best = null;
  for (const sn of wb.SheetNames) {
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null, blankrows: true });
    const det = E.detectarBanco(grid, sn, ST.cfg.bancos, ST.cfg.cuentas);
    const n = det.headerRow >= 0 ? E.extraerMovs(grid, det, 'x').length : 0;
    if (!best || n > best.n) best = { grid, det, n, sn };
  }
  abrirImport(best.grid, best.det, file.name);
}
function abrirImport(grid, det, nombre) {
  if (det.headerRow < 0) det.headerRow = 0;
  UI.imp = { grid, det, map: { headerRow: det.headerRow, cols: { ...det.cols } }, banco: det.banco || '', nombre };
  render();
}
async function guardarImport() {
  const I = UI.imp; if (!I || !I.banco || I.guardando) return;
  const banco = I.banco;
  const items = E.extraerMovs(I.grid, I.map, banco);
  const arr = ST.mov[banco] || [];
  const ids = new Set(arr.map(x => x.id));
  const base = Date.now() * 1000;
  const nuevos = [];
  items.forEach((it, i) => { it.orden = base + i; if (!ids.has(it.id)) { nuevos.push(it); ids.add(it.id); } });
  I.guardando = true; render();
  try {
    await dbMovs(banco, nuevos);
    if (I.det.cuenta && ST.cfg.cuentas[I.det.cuenta] !== banco) { ST.cfg.cuentas[I.det.cuenta] = banco; await dbCfg(); }
  } catch (e) { I.guardando = false; render(); return; }
  ST.mov[banco] = ordenarMovs(arr.concat(nuevos));
  UI.imp = null;
  const fs = items.map(x => x.f).sort();
  if (fs.length && !Object.keys(ST.sis).length) { UI.desde = fs[fs.length - 1]; UI.hasta = fs[fs.length - 1]; }
  if (fs.length && ST.movDesde && fs[0] < ST.movDesde) ST.movDesde = fs[0];
  toast(`${bancoN(banco)}: ${nuevos.length} movimientos nuevos guardados`);
  render();
}

  const conc = r.matches.flatMap(m => {
    const n = Math.max(m.s.length, m.b.length);
    return Array.from({ length: n }, (_, i) => ({ Banco: b, Tipo: TIPO[m.tipo][1], 'Fecha sistema': m.s[i] ? fdl(m.s[i].f) : '', 'Doc': m.s[i]?.doc || '', 'Descripción sistema': m.s[i]?.desc || '', 'Monto sistema': m.s[i]?.monto ?? '', 'Fecha banco': m.b[i] ? fdl(m.b[i].f) : '', 'Referencia': m.b[i]?.ref || '', 'Descripción banco': m.b[i]?.desc || '', 'Monto banco': m.b[i]?.monto ?? '', 'Dirección': (m.s[i] || m.b[i]).dir === 'in' ? 'Ingreso' : 'Egreso', 'Nota': i === 0 ? (m.nota || '') : '' }));
  });
  const pista = x => (x.flags || []).map(f => f.t === 'cerca' ? `Monto ${f.b.monto} en banco ${fdl(f.b.f)}` : f.t === 'dup' ? 'Posible duplicado' : f.t === 'otroBanco' ? `Aparece en ${bancoN(f.banco)}` : '').filter(Boolean).join('; ');
  const ps = r.soloSis.map(x => ({ Banco: b, Fecha: fdl(x.f), Doc: x.doc, 'Descripción': x.desc, 'Dirección': x.dir === 'in' ? 'Ingreso' : 'Egreso', Monto: x.monto, Pista: pista(x) }));
  const pb = r.soloBan.map(x => ({ Banco: b, Fecha: fdl(x.f), Referencia: x.ref, 'Código': x.cod, 'Descripción': x.desc, 'Dirección': x.dir === 'in' ? 'Crédito' : 'Débito', Monto: x.monto }));
  const dias = r.dias.map(d => ({ Banco: b, Fecha: fdl(d.f), 'Ingresos sistema': d.sIn, 'Créditos banco': d.bIn, 'Dif. ingresos': +(d.sIn - d.bIn).toFixed(2), 'Egresos sistema': d.sOut, 'Débitos banco': d.bOut, 'Dif. egresos': +(d.sOut - d.bOut).toFixed(2), 'Pendientes sistema': d.pendS, 'Pendientes banco': d.pendB }));
  const just = r.justificados.map(x => ({ Banco: b, Origen: x.lado === 's' ? 'Sistema' : 'Banco', Fecha: fdl(x.f), 'Descripción': (x.doc ? x.doc + ' ' : '') + x.desc, Monto: x.monto, Nota: ST.man.just[x.id]?.nota || '' }));
  return { conc, ps, pb, dias, just };
}
function exportar() {
  const wb = XLSX.utils.book_new();
  const all = { conc: [], ps: [], pb: [], dias: [], just: [] }; const resumen = [];
  for (const id of Object.keys(RES)) {
    const r = RES[id]; const f = filasExport(r);
    for (const k in all) all[k].push(...f[k]);
    resumen.push({ Banco: bancoN(id), 'Ingresos sistema': r.tot.sIn, 'Créditos banco': r.tot.bIn, 'Egresos sistema': r.tot.sOut, 'Débitos banco': r.tot.bOut, Conciliados: r.tot.conc, 'Pendientes sistema': r.tot.nPendS, 'Monto pend. sistema': r.tot.pendS, 'Pendientes banco': r.tot.nPendB, 'Monto pend. banco': r.tot.pendB });
  }
  const add = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': 'Sin datos' }]), name);
  add(resumen, 'Resumen'); add(all.ps, 'Solo en sistema'); add(all.pb, 'Solo en banco'); add(all.conc, 'Conciliados'); add(all.dias, 'Por día'); add(all.just, 'Justificados');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const nombre = `Conciliacion ${UI.desde}${UI.hasta !== UI.desde ? ' a ' + UI.hasta : ''}.xlsx`;
  descargar(nombre, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
function copiarPendientes() {
  const r = RES[UI.banco]; if (!r) return;
  const { ps, pb } = filasExport(r);
  const lines = ['Origen\tFecha\tDescripción\tDirección\tMonto\tPista'];
  ps.forEach(x => lines.push(['Sistema', x.Fecha, x.Doc + ' ' + x['Descripción'], x['Dirección'], x.Monto, x.Pista].join('\t')));
  pb.forEach(x => lines.push(['Banco', x.Fecha, x['Descripción'] + (x.Referencia ? ' Ref ' + x.Referencia : ''), x['Dirección'], x.Monto, ''].join('\t')));
  copiar(lines.join('\n'));
}

  const sec = (nombre, rows) => { let sal = 0; const out = [`${nombre}\t\tLps. 0.00`]; rows.forEach(r => { sal += (parseFloat(String(r[2]).replace(/,/g, '')) || 0) - (parseFloat(String(r[3]).replace(/,/g, '')) || 0); out.push([...r, 'Lps. ' + sal.toLocaleString('en-US', { minimumFractionDigits: 2 })].join('\t')); }); out.push(`Cierre diario\tLps. ${sal.toFixed(2)}`); return out.join('\n'); };
  P(f1, [sec('Bac', [L('PP', 'Pago a préstamo', 1250), L('PP', 'Pago a préstamo', 980), L('PP', 'Pago a préstamo', 2000), L('PP', 'Pago a préstamo', 1350), L('TFB', 'Traslado de fondos entre BAC a CAJA, Préstamo aprobado (Cliente Ejemplo)', 0, 6000), L('PP', 'Pago a préstamo', 1800)]), sec('Ficohsa', [L('PP', 'Pago a préstamo', 700)])].join('\n'));

/* ================== Eventos ================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'sel') return; // lo maneja change
  const A = {
    ir: () => { UI.tab = el.dataset.tab; render(); },
    banco: () => { UI.banco = el.dataset.id; UI.sel.clear(); render(); },
    vista: () => { UI.vista = el.dataset.k; render(); },
    rango: () => {
      const fs = Object.keys(ST.sis).sort(); const last = fs.length ? fs[fs.length - 1] : hoy();
      if (el.dataset.k === 'dia') { UI.desde = UI.hasta = last; }
      else if (el.dataset.k === 'semana') { UI.hasta = last; UI.desde = E.addDays(last, -6); }
      else { UI.hasta = last; UI.desde = last.slice(0, 8) + '01'; }
      UI.sel.clear(); render(); asegurarMovs(UI.desde).then(render);
    },
    exportar, copiarPend: copiarPendientes,
    vincular1: async () => { const l = { s: [el.dataset.s], b: [el.dataset.b], nota: '' }; try { await dbLink(l); } catch (e) { return; } ST.man.links.push(l); render(); },
    vincularSel: async () => {
      const r = RES[UI.banco]; const all = new Map([...r.soloSis, ...r.soloBan, ...r.justificados].map(x => [x.id, x]));
      const sel = [...UI.sel].map(id => all.get(id)).filter(Boolean);
      const nota = ($('#notaSel') || {}).value || '';
      const l = { s: sel.filter(x => x.lado === 's').map(x => x.id), b: sel.filter(x => x.lado === 'b').map(x => x.id), nota };
      const yaJust = sel.filter(x => ST.man.just[x.id]).map(x => x.id);
      try { await dbLink(l); if (yaJust.length) await dbDesJust(yaJust); } catch (e) { return; }
      yaJust.forEach(id => delete ST.man.just[id]);
      ST.man.links.push(l); UI.sel.clear(); render();
    },
    justificar: async () => { const id = el.dataset.id; try { await dbJust([id], '', 'Movido a Justificados'); } catch (e) { return; } ST.man.just[id] = { nota: '', por: usr() }; UI.sel.delete(id); render(); },
    justificarSel: async () => { const nota = ($('#notaSel') || {}).value || ''; const ids = [...UI.sel]; try { await dbJust(ids, nota, 'Movidos a Justificados'); } catch (e) { return; } ids.forEach(id => ST.man.just[id] = { nota, por: usr() }); UI.sel.clear(); render(); },
    desjustificar: async () => { const id = el.dataset.id; try { await dbDesJust([id]); } catch (e) { return; } delete ST.man.just[id]; render(); },
    limpiarSel: () => { UI.sel.clear(); render(); },
    deshacer: async () => {
      const ids = el.dataset.ids.split('§');
      try {
        if (el.dataset.tipo === 'manual' && el.dataset.link !== '') {
          const idx = +el.dataset.link, l = ST.man.links[idx];
          await dbBorrarLink(l.id); ST.man.links.splice(idx, 1);
        } else {
          const nuevos = ids.filter(id => !ST.man.noAuto.includes(id));
          await dbNoAuto(nuevos); ST.man.noAuto.push(...nuevos);
        }
      } catch (e) { return; }
      render();
    },
    leerPegaBanco: () => {
      const t = $('#pegaBanco').value; if (!t.trim()) return toast('Pegue primero los movimientos');
      const grid = t.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.includes('\t') ? l.split('\t') : l.split(/\s{2,}|;/));
      const det = E.detectarBanco(grid, '', ST.cfg.bancos, ST.cfg.cuentas);
      if (det.headerRow < 0) { det.headerRow = -1; det.cols = { fecha: 0, desc: 1, cred: 2 }; }
      UI.imp = { grid, det, map: { headerRow: det.headerRow, cols: { ...det.cols } }, banco: det.banco || '', nombre: 'Movimientos pegados' };
      render();
    },
    cancelImp: () => { UI.imp = null; render(); },
    guardarImp: guardarImport,
    leerSis: () => {
      UI.sisTexto = $('#sisTexto').value; UI.sisFecha = $('#sisFecha').value || UI.sisFecha;
      if (!UI.sisTexto.trim()) return toast('Pegue primero el reporte');
      UI.sisPrev = E.parseSistema(UI.sisTexto, ST.cfg.bancos); render();
    },
    guardarSis: async () => {
      const f = $('#sisFecha').value || UI.sisFecha;
      const d = { secciones: UI.sisPrev.secciones, avisos: UI.sisPrev.avisos, texto: UI.sisTexto, por: usr(), guardado: ahora() };
      try { await dbSis(f, d); } catch (e) { return; }
      ST.sis[f] = d; UI.sisPrev = null; UI.sisTexto = ''; UI.verDia = f; UI.sisFecha = E.addDays(f, 1);
      UI.desde = UI.hasta = f; render();
    },
    cancelSis: () => { UI.sisPrev = null; render(); },
    verDia: () => { UI.verDia = UI.verDia === el.dataset.f ? null : el.dataset.f; UI.confirm = null; render(); },
    editarSis: () => { const f = el.dataset.f; UI.sisFecha = f; UI.sisTexto = ST.sis[f].texto || ''; UI.sisPrev = null; render(); window.scrollTo({ top: 0 }); },
    confirm: () => { UI.confirm = el.dataset.k; render(); },
    cancelConfirm: () => { UI.confirm = null; render(); },
    borrarMov: async () => { const b = el.dataset.id; try { await dbBorrarMovs(b); } catch (e) { return; } delete ST.mov[b]; UI.confirm = null; render(); },
    borrarSis: async () => { const f = el.dataset.f; try { await dbBorrarSis(f); } catch (e) { return; } delete ST.sis[f]; UI.confirm = null; UI.verDia = null; render(); },
    recargarTodo: () => { FASE.msg = ''; arrancar(); },
    recargar: async () => { FASE.v = 'cargando'; render(); try { await cargar(); } catch (e) { FASE.v = 'error'; FASE.msg = 'No se pudo cargar: ' + (e.message || e); } render(); },
    salir: async () => { try { await SB.auth.signOut(); } catch (e) {} USER = null; ST = vacio(); FASE.v = 'login'; render(); },
    cambiarConexion: () => { try { localStorage.removeItem('concilia.sbUrl'); localStorage.removeItem('concilia.sbKey'); } catch (e) {} FASE.v = 'config'; render(); },
    agregarBanco: () => {
      const n = $('#nuevoBanco').value.trim(); if (!n) return;
      const id = E.norm(n).replace(/[^a-z0-9]+/g, '') || 'banco' + Date.now();
      if (ST.cfg.bancos.some(b => b.id === id)) return toast('Ese banco ya existe');
      ST.cfg.bancos.push({ id, nombre: n, alias: [E.norm(n)], antes: 0, despues: 1, finde: false, nocturno: false, activo: true });
      dbCfg('Banco agregado').catch(() => {}); render();
    },
    copiarCargos: () => { const g = gruposCargos(); copiar(g.map(filaCargo).join('\n')); },
    copiarCargo: () => { const o = gruposCargos()[+el.dataset.i]; if (o) copiar(filaCargo(o)); },
    guardarCargos: () => {
      const ks = $('#cargos').value.split('\n').map(x => x.trim()).filter(Boolean);
      ST.cfg.cargos = ks.length ? ks : CARGOS_BASE.slice(); dbCfg('Palabras de cargos guardadas').catch(() => {}); render();
    },
    guardarFeriados: () => {
      const fs = $('#feriados').value.split(/[\n,]+/).map(x => E.parseFecha(x.trim())).filter(Boolean);
      ST.cfg.feriados = [...new Set(fs)].sort(); dbCfg(`${ST.cfg.feriados.length} feriados guardados`).catch(() => {}); render();
    },
    respaldo: () => descargar(`Concilia respaldo ${hoy()}.json`, JSON.stringify(ST)),
    verEjemplo: () => { REAL = ST; ST = datosEjemplo(); ejemplo = true; UI.desde = '2026-09-11'; UI.hasta = '2026-09-14'; UI.banco = 'bac'; UI.tab = 'conciliar'; render(); },
    salirEjemplo: () => { ST = REAL || vacio(); REAL = null; ejemplo = false; UI.desde = UI.hasta = null; UI.banco = null; UI.sel.clear(); render(); }
  };
  if (A[a]) A[a]();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'sel') { t.checked ? UI.sel.add(t.dataset.id) : UI.sel.delete(t.dataset.id); render(); return; }
  if (t.id === 'desde' || t.id === 'hasta') { UI[t.id] = t.value; UI.sel.clear(); render(); if (t.id === 'desde') { await asegurarMovs(t.value); render(); } return; }
  if (t.id === 'fileBanco') { for (const f of t.files) { try { await leerArchivoBanco(f); } catch (err) { toast('No se pudo leer ' + f.name); } break; } t.value = ''; return; }
  if (t.id === 'impBanco') { UI.imp.banco = t.value; render(); return; }
  if (t.id === 'impHeader') { UI.imp.map.headerRow = Math.max(0, (+t.value || 1) - 1); UI.imp.map.cols = E.detectarColumnas(UI.imp.grid[UI.imp.map.headerRow] || []); render(); return; }
  if (t.dataset.col) { const v = t.value; if (v === '') delete UI.imp.map.cols[t.dataset.col]; else UI.imp.map.cols[t.dataset.col] = +v; render(); return; }
  if (t.id === 'sisFecha') { UI.sisFecha = t.value; UI.sisTexto = ($('#sisTexto') || {}).value || UI.sisTexto; render(); return; }
  const bc = t.closest('.bank-cfg');
  if (bc) {
    const b = ST.cfg.bancos.find(x => x.id === bc.dataset.bank); const k = t.dataset.k;
    if (k === 'alias') b.alias = t.value.split(',').map(x => E.norm(x)).filter(Boolean);
    else if (t.type === 'checkbox') b[k] = t.checked;
    else if (t.type === 'number') b[k] = Math.max(0, +t.value || 0);
    else b[k] = t.value;
    dbCfg('Ajuste guardado').catch(() => {});
  }
});
document.addEventListener('input', e => { if (e.target.id === 'sisTexto') UI.sisTexto = e.target.value; });

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'formConfig') {
    const u = $('#cfgUrl').value.trim().replace(/\/+$/, ''), k = $('#cfgKey').value.trim();
    if (!/^https:\/\/.+/.test(u) || k.length < 20) { FASE.msg = 'Revise la URL (empieza con https://) y la llave.'; return render(); }
    try { localStorage.setItem('concilia.sbUrl', u); localStorage.setItem('concilia.sbKey', k); } catch (err) {}
    FASE.msg = ''; arrancar();
  }
  if (f.id === 'formLogin') {
    const btn = $('#btnLogin'); btn.disabled = true; btn.textContent = 'Entrando…'; FASE.email = $('#logEmail').value.trim();
    const { data, error } = await SB.auth.signInWithPassword({ email: $('#logEmail').value.trim(), password: $('#logPass').value });
    if (error) { FASE.msg = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message; return render(); }
    USER = data.user; FASE.msg = ''; FASE.v = 'cargando'; render();
    try { await cargar(); } catch (err) { FASE.v = 'error'; FASE.msg = /cb_|relation|does not exist|schema cache|function/i.test(err.message || '') ? 'Las tablas de conciliación no existen todavía en este proyecto. Corra el archivo cb_conciliacion.sql en el SQL Editor de Supabase.' : 'No se pudo cargar: ' + (err.message || err); }
    render();
  }
});

render(); arrancar();
